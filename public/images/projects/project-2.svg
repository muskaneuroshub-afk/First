<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#p2bg)" />
  <rect x="40" y="40" width="720" height="370" rx="12" fill="#0f0f0f" stroke="#262626" stroke-width="1.5" />
  
  <!-- Swatch Tokens Grid (Monochrome steps) -->
  <rect x="80" y="90" width="120" height="120" rx="12" fill="#ffffff" />
  <text x="80" y="235" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#a3a3a3">--primary-white</text>

  <rect x="230" y="90" width="120" height="120" rx="12" fill="#d4d4d4" />
  <text x="230" y="235" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#a3a3a3">--text-secondary</text>

  <rect x="380" y="90" width="120" height="120" rx="12" fill="#666666" />
  <text x="380" y="235" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#a3a3a3">--border-strong</text>

  <rect x="530" y="90" width="120" height="120" rx="12" fill="#262626" />
  <text x="530" y="235" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#a3a3a3">--border-subtle</text>

  <!-- Code snippet area -->
  <rect x="80" y="260" width="640" height="120" rx="8" fill="#141414" stroke="#262626" />
  <text x="105" y="295" font-family="monospace" font-size="14" fill="#ffffff">:root { --color-primary: #0a0a0a; --radius-card: 12px; }</text>
  <text x="105" y="325" font-family="monospace" font-size="14" fill="#a3a3a3">[data-theme='dark'] { --color-primary: #ffffff; }</text>
  <text x="700" y="395" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#737373" text-anchor="end">DESIGN TOKENS MOCKUP</text>
</svg>
